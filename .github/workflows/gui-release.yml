name: Build GUI portable release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "NarouDownloaderGui/**"
      - "scripts/publish-gui.ps1"
      - ".github/workflows/gui-release.yml"
  push:
    branches:
      - main
      - codex/winui-gui
    tags:
      - "gui-v*"
    paths:
      - "NarouDownloaderGui/**"
      - "scripts/publish-gui.ps1"
      - ".github/workflows/gui-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build portable GUI
        shell: pwsh
        run: .\scripts\publish-gui.ps1

      - name: Upload portable GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: NarouDownloaderGui-win-x64
          path: artifacts/NarouDownloaderGui-win-x64.zip
          if-no-files-found: error

      - name: Attach portable GUI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/gui-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "artifacts/NarouDownloaderGui-win-x64.zip"
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" $asset --clobber
          }
          else {
            gh release create "$env:GITHUB_REF_NAME" $asset `
              --title "なろうダウンローダー GUI $env:GITHUB_REF_NAME" `
              --generate-notes
          }
